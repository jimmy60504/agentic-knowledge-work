<text x="320.0" y="447.0" font-size="26" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">定位解</text>
<text x="320.0" y="485.0" font-size="22" fill="#6B6560" font-weight="400" text-anchor="middle" dominant-baseline="central">每次定位都保留一版</text>
<line x1="522" y1="465" x2="588" y2="430.0" stroke="#5F7F95" stroke-width="3" marker-end="url(#ab)"/>
<rect x="120" y="610" width="400" height="130" rx="12" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="2"/>
<text x="320.0" y="657.0" font-size="26" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">挑選與關聯</text>
<text x="320.0" y="695.0" font-size="22" fill="#6B6560" font-weight="400" text-anchor="middle" dominant-baseline="central">依 QuakeML 的概念拆分</text>
<line x1="522" y1="675" x2="588" y2="482.5" stroke="#5F7F95" stroke-width="3" marker-end="url(#ab)"/>
<rect x="1080" y="190" width="400" height="130" rx="12" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="2"/>
<text x="1280.0" y="220.0" font-size="26" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">工作紀錄</text>
<text x="1280.0" y="258.0" font-size="22" fill="#6B6560" font-weight="400" text-anchor="middle" dominant-baseline="central">每次輸入與輸出</text>
<text x="1280.0" y="292.0" font-size="22" fill="#6B6560" font-weight="400" text-anchor="middle" dominant-baseline="central">查得到根據哪一版</text>
<line x1="1078" y1="255" x2="1012" y2="377.5" stroke="#5F7F95" stroke-width="3" marker-end="url(#ab)"/>
<rect x="1080" y="400" width="400" height="130" rx="12" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="2"/>
<text x="1280.0" y="447.0" font-size="26" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">波形索引</text>
<text x="1280.0" y="485.0" font-size="22" fill="#6B6560" font-weight="400" text-anchor="middle" dominant-baseline="central">原檔留在外部</text>
<line x1="1078" y1="465" x2="1012" y2="430.0" stroke="#5F7F95" stroke-width="3" marker-end="url(#ab)"/>
<rect x="1080" y="610" width="400" height="130" rx="12" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="2"/>
<text x="1280.0" y="657.0" font-size="26" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">進度</text>
<text x="1280.0" y="695.0" font-size="22" fill="#6B6560" font-weight="400" text-anchor="middle" dominant-baseline="central">以工作日計算</text>
<line x1="1078" y1="675" x2="1012" y2="482.5" stroke="#5F7F95" stroke-width="3" marker-end="url(#ab)"/>
</svg>
