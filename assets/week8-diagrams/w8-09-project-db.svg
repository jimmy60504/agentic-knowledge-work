<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="PingFang TC, Hiragino Sans GB, sans-serif">
<defs><marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BE8979"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F7F95"/></marker></defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="60" y="80" font-size="44" fill="#2A2623" font-weight="600" text-anchor="start" dominant-baseline="central">專案資料庫的內容</text>
<text x="60" y="132" font-size="24" fill="#6B6560" font-weight="400" text-anchor="start" dominant-baseline="central">想法來自反射震測處理系統與其他類似的地震分析軟體</text>
<rect x="590" y="330" width="420" height="200" rx="12" fill="#E8EFF3" stroke="#5F7F95" stroke-width="3"/>
<text x="800.0" y="393.0" font-size="34" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">專案資料庫</text>
<text x="800.0" y="436.0" font-size="24" fill="#6B6560" font-weight="400" text-anchor="middle" dominant-baseline="central">各模組共用</text>
<text x="800.0" y="472.0" font-size="24" fill="#6B6560" font-weight="400" text-anchor="middle" dominant-baseline="central">資料與處理都在專案內</text>
<rect x="120" y="190" width="400" height="130" rx="12" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="2"/>
<text x="320.0" y="220.0" font-size="26" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">事件</text>
<text x="320.0" y="258.0" font-size="22" fill="#6B6560" font-weight="400" text-anchor="middle" dominant-baseline="central">工作的單位</text>
<text x="320.0" y="292.0" font-size="22" fill="#6B6560" font-weight="400" text-anchor="middle" dominant-baseline="central">有自己的狀態</text>
<line x1="522" y1="255" x2="588" y2="377.5" stroke="#5F7F95" stroke-width="3" marker-end="url(#ab)"/>
