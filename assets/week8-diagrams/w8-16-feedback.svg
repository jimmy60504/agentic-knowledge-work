<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="PingFang TC, Hiragino Sans GB, sans-serif">
<defs><marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BE8979"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F7F95"/></marker></defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="60" y="80" font-size="44" fill="#2A2623" font-weight="600" text-anchor="start" dominant-baseline="central">迭代週期的對照</text>
<text x="60" y="132" font-size="24" fill="#6B6560" font-weight="400" text-anchor="start" dominant-baseline="central">短時間得到回饋，操作時累積體感，知道哪些值如何影響最終結果</text>
<text x="60" y="260" font-size="30" fill="#2A2623" font-weight="600" text-anchor="start" dominant-baseline="central">過去</text>
<rect x="190" y="210" width="260" height="100" rx="12" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="2"/>
<text x="320.0" y="260.0" font-size="26" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">修改到時</text>
<rect x="510" y="210" width="260" height="100" rx="12" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="2"/>
<text x="640.0" y="260.0" font-size="26" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">全部跑完</text>
<rect x="830" y="210" width="320" height="100" rx="12" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="2"/>
<text x="990.0" y="260.0" font-size="26" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">自己想辦法畫圖</text>
<rect x="1210" y="210" width="290" height="100" rx="12" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="2"/>
<text x="1355.0" y="260.0" font-size="26" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">才看到結果</text>
<line x1="452" y1="260" x2="508" y2="260" stroke="#6B6560" stroke-width="3" marker-end="url(#am)"/>
<line x1="772" y1="260" x2="828" y2="260" stroke="#6B6560" stroke-width="3" marker-end="url(#am)"/>
<line x1="1152" y1="260" x2="1208" y2="260" stroke="#6B6560" stroke-width="3" marker-end="url(#am)"/>
<path d="M1355,312 C1355,410 335,410 320,318" fill="none" stroke="#6B6560" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#am)"/>
<text x="800" y="420" font-size="24" fill="#6B6560" font-weight="400" text-anchor="middle" dominant-baseline="central">一次迭代的週期很長</text>
<text x="60" y="620" font-size="30" fill="#2A2623" font-weight="600" text-anchor="start" dominant-baseline="central">現在</text>
<rect x="190" y="560" width="260" height="110" rx="12" fill="#E8EFF3" stroke="#5F7F95" stroke-width="3"/>
<text x="320.0" y="615.0" font-size="26" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">修改到時</text>
<rect x="620" y="560" width="420" height="110" rx="12" fill="#E8EFF3" stroke="#5F7F95" stroke-width="3"/>
<text x="830.0" y="615.0" font-size="26" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">地圖與殘差立即更新</text>
<path d="M452,590 C520,540 560,540 618,590" fill="none" stroke="#5F7F95" stroke-width="4" marker-end="url(#ab)"/>
<path d="M618,645 C560,700 520,700 452,645" fill="none" stroke="#5F7F95" stroke-width="4" marker-end="url(#ab)"/>
<text x="1090" y="615" font-size="26" fill="#5F7F95" font-weight="600" text-anchor="start" dominant-baseline="central">反覆多次，在腦中建立連結</text>
</svg>
