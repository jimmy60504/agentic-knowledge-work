<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="PingFang TC, Hiragino Sans GB, sans-serif">
<defs><marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BE8979"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F7F95"/></marker></defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="60" y="80" font-size="44" fill="#2A2623" font-weight="600" text-anchor="start" dominant-baseline="central">同一條規則的兩種寫法</text>
<text x="60" y="132" font-size="24" fill="#6B6560" font-weight="400" text-anchor="start" dominant-baseline="central">由批評與阻擋轉為正向引導</text>
<text x="380" y="215" font-size="32" fill="#6B6560" font-weight="600" text-anchor="middle" dominant-baseline="central">錯在哪裡</text>
<text x="1140" y="215" font-size="32" fill="#BE8979" font-weight="600" text-anchor="middle" dominant-baseline="central">還有哪件事要完成</text>
<rect x="110" y="255" width="540" height="98" rx="12" fill="#FFFFFF" stroke="#D8D2C9" stroke-width="2"/>
<text x="380.0" y="304.0" font-size="28" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">測站數不足</text>
<line x1="670" y1="304" x2="840" y2="304" stroke="#BE8979" stroke-width="3" marker-end="url(#aa)"/>
<rect x="860" y="255" width="560" height="98" rx="12" fill="#F6E9E4" stroke="#BE8979" stroke-width="3"/>
<text x="1140.0" y="304.0" font-size="28" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">挑選足夠的測站</text>
<rect x="110" y="373" width="540" height="98" rx="12" fill="#FFFFFF" stroke="#D8D2C9" stroke-width="2"/>
<text x="380.0" y="422.0" font-size="28" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">近站未挑選</text>
<line x1="670" y1="422" x2="840" y2="422" stroke="#BE8979" stroke-width="3" marker-end="url(#aa)"/>
<rect x="860" y="373" width="560" height="98" rx="12" fill="#F6E9E4" stroke="#BE8979" stroke-width="3"/>
<text x="1140.0" y="422.0" font-size="28" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">挑選更近的測站</text>
<rect x="110" y="491" width="540" height="98" rx="12" fill="#FFFFFF" stroke="#D8D2C9" stroke-width="2"/>
<text x="380.0" y="540.0" font-size="28" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">方位角空隙過大</text>
<line x1="670" y1="540" x2="840" y2="540" stroke="#BE8979" stroke-width="3" marker-end="url(#aa)"/>
<rect x="860" y="491" width="560" height="98" rx="12" fill="#F6E9E4" stroke="#BE8979" stroke-width="3"/>
<text x="1140.0" y="540.0" font-size="28" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">確保震央穩定</text>
<rect x="110" y="609" width="540" height="98" rx="12" fill="#FFFFFF" stroke="#D8D2C9" stroke-width="2"/>
<text x="380.0" y="658.0" font-size="28" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">殘差過大</text>
<line x1="670" y1="658" x2="840" y2="658" stroke="#BE8979" stroke-width="3" marker-end="url(#aa)"/>
<rect x="860" y="609" width="560" height="98" rx="12" fill="#F6E9E4" stroke="#BE8979" stroke-width="3"/>
<text x="1140.0" y="658.0" font-size="28" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">檢查離群的到時</text>
<text x="800" y="790" font-size="28" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">剛開始挑波時測站數不足，呈現為尚未完成，不列為錯誤。</text>
</svg>
