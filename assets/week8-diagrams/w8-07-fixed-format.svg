<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="PingFang TC, Hiragino Sans GB, sans-serif">
<defs><marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BE8979"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F7F95"/></marker></defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="60" y="80" font-size="44" fill="#2A2623" font-weight="600" text-anchor="start" dominant-baseline="central">沿用數十年的固定格式</text>
<text x="60" y="132" font-size="24" fill="#6B6560" font-weight="400" text-anchor="start" dominant-baseline="central">各程式獨立演化，彼此以檔案交接，任何一支程式都難以更改格式</text>
<text x="110" y="225" font-size="24" fill="#6B6560" font-weight="400" text-anchor="start" dominant-baseline="central">每個欄位的寬度都已固定（示意）</text>
<rect x="110" y="260" width="150" height="90" rx="12" fill="#FFFFFF" stroke="#D8D2C9" stroke-width="2"/>
<text x="185.0" y="305.0" font-size="22" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">年月日</text>
<rect x="260" y="260" width="90" height="90" rx="12" fill="#FFFFFF" stroke="#D8D2C9" stroke-width="2"/>
<text x="305.0" y="305.0" font-size="22" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">時分</text>
<rect x="350" y="260" width="90" height="90" rx="12" fill="#FFFFFF" stroke="#D8D2C9" stroke-width="2"/>
<text x="395.0" y="305.0" font-size="22" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">秒</text>
<rect x="440" y="260" width="110" height="90" rx="12" fill="#FFFFFF" stroke="#D8D2C9" stroke-width="2"/>
<text x="495.0" y="305.0" font-size="22" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">緯度</text>
<rect x="550" y="260" width="110" height="90" rx="12" fill="#FFFFFF" stroke="#D8D2C9" stroke-width="2"/>
<text x="605.0" y="305.0" font-size="22" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">經度</text>
<rect x="660" y="260" width="90" height="90" rx="12" fill="#FFFFFF" stroke="#D8D2C9" stroke-width="2"/>
<text x="705.0" y="305.0" font-size="22" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">深度</text>
<rect x="750" y="260" width="90" height="90" rx="12" fill="#FFFFFF" stroke="#D8D2C9" stroke-width="2"/>
<text x="795.0" y="305.0" font-size="22" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">規模</text>
<rect x="840" y="260" width="80" height="90" rx="12" fill="#FFFFFF" stroke="#D8D2C9" stroke-width="2"/>
<text x="880.0" y="305.0" font-size="22" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">站數</text>
<rect x="920" y="260" width="130" height="90" rx="12" fill="#FFFFFF" stroke="#D8D2C9" stroke-width="2"/>
<text x="985.0" y="305.0" font-size="22" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">定位品質</text>
<rect x="1060" y="260" width="170" height="90" rx="12" fill="#F6E9E4" stroke="#BE8979" stroke-width="3"/>
<text x="1145.0" y="305.0" font-size="24" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">新資訊？</text>
<rect x="110" y="470" width="440" height="170" rx="12" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="2"/>
<text x="330.0" y="520.0" font-size="28" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">無法記錄歷史</text>
<text x="330.0" y="559.0" font-size="22" fill="#6B6560" font-weight="400" text-anchor="middle" dominant-baseline="central">沒有多餘的位置</text>
<text x="330.0" y="593.0" font-size="22" fill="#6B6560" font-weight="400" text-anchor="middle" dominant-baseline="central">重新定位時整檔改寫</text>
<rect x="580" y="470" width="440" height="170" rx="12" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="2"/>
<text x="800.0" y="537.0" font-size="28" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">精度受到限制</text>
<text x="800.0" y="576.0" font-size="22" fill="#6B6560" font-weight="400" text-anchor="middle" dominant-baseline="central">小數位數由欄寬決定</text>
<rect x="1050" y="470" width="440" height="170" rx="12" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="2"/>
<text x="1270.0" y="537.0" font-size="28" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">新資訊難以加入</text>
<text x="1270.0" y="576.0" font-size="22" fill="#6B6560" font-weight="400" text-anchor="middle" dominant-baseline="central">多支程式都依賴這個格式</text>
<text x="800" y="750" font-size="28" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">已無法應付現在的需求。</text>
</svg>
