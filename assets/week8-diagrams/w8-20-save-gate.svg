<text x="1025.0" y="372.0" font-size="28" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">事件總覽的 QC</text>
<text x="1025.0" y="411.0" font-size="22" fill="#6B6560" font-weight="400" text-anchor="middle" dominant-baseline="central">實際的攔截</text>
