<text x="235.0" y="412.0" font-size="22" fill="#6B6560" font-weight="400" text-anchor="middle" dominant-baseline="central">任務列表即時提示</text>
<rect x="470" y="300" width="330" height="180" rx="12" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="2"/>
<text x="635.0" y="355.0" font-size="30" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">存檔</text>
