<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" font-family="PingFang TC, Hiragino Sans GB, sans-serif">
<defs>
<marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker>
</defs>
<rect width="1000" height="1000" fill="#FFFFFF"/>
<!-- depth axis -->
<line x1="80" y1="860" x2="80" y2="130" stroke="#6B6560" stroke-width="3" marker-end="url(#ahG)"/>
<text x="55" y="495" font-size="26" fill="#2A2623" font-weight="600" text-anchor="middle" transform="rotate(-90 55 495)">使用深度</text>
<!-- bands -->
<g>
<rect x="120" y="140" width="640" height="210" rx="20" fill="#E9EEEF" stroke="#A6B7BA" stroke-width="3"/>
<text x="150" y="200" font-size="32" fill="#2A2623" font-weight="700">放進固定流程</text>
<text x="150" y="238" font-size="20" fill="#6B6560">做成工具或設置檢查點</text>

<rect x="120" y="385" width="640" height="210" rx="20" fill="#F5F2EC" stroke="#A6B7BA" stroke-width="3"/>
<text x="150" y="445" font-size="32" fill="#2A2623" font-weight="700">交辦整件工作</text>
<text x="150" y="483" font-size="20" fill="#6B6560">交出去後自己檢查結果</text>

<rect x="120" y="630" width="640" height="210" rx="20" fill="#FBFAF7" stroke="#D8D2C9" stroke-width="3"/>
<text x="150" y="690" font-size="32" fill="#2A2623" font-weight="700">一問一答</text>
<text x="150" y="728" font-size="20" fill="#6B6560">查資料、改文字</text>
</g>
<!-- type pills -->
<g font-size="24" font-weight="600" text-anchor="middle">
<rect x="150" y="268" width="170" height="52" rx="26" fill="#FFFFFF" stroke="#A6B7BA" stroke-width="3"/><text x="235" y="303" fill="#2A2623">推廣者</text>
<text x="340" y="302" font-size="19" font-weight="400" fill="#6B6560" text-anchor="start">並帶別人一起用</text>

<rect x="150" y="513" width="200" height="52" rx="26" fill="#FFFFFF" stroke="#A6B7BA" stroke-width="3"/><text x="250" y="548" fill="#2A2623">深度使用者</text>
<text x="370" y="547" font-size="19" font-weight="400" fill="#6B6560" text-anchor="start">公開使用</text>

<rect x="150" y="758" width="150" height="52" rx="26" fill="#FFFFFF" stroke="#A6B7BA" stroke-width="3"/><text x="225" y="793" fill="#2A2623">探索者</text>
<rect x="320" y="758" width="150" height="52" rx="26" fill="#FFFFFF" stroke="#A6B7BA" stroke-width="3"/><text x="395" y="793" fill="#2A2623">跟隨者</text>
<rect x="490" y="758" width="200" height="52" rx="26" fill="#FFFFFF" stroke="#BE8979" stroke-width="3"/><text x="590" y="793" fill="#2A2623">被迫使用者</text>
</g>
<!-- private users spanning -->
<rect x="790" y="140" width="170" height="700" rx="20" fill="none" stroke="#6B6560" stroke-width="2" stroke-dasharray="10 8"/>
<text x="875" y="470" font-size="26" font-weight="700" fill="#2A2623" text-anchor="middle">私下使用者</text>
<text x="875" y="512" font-size="19" fill="#6B6560" text-anchor="middle">深度不一定低</text>
<text x="875" y="540" font-size="19" fill="#6B6560" text-anchor="middle">只是不公開</text>
<text x="875" y="580" font-size="19" fill="#6B6560" text-anchor="middle">三層都可能</text>
<!-- footer -->
<text x="440" y="905" font-size="21" fill="#BE8979" font-weight="600" text-anchor="middle">越往上，越需要驗收標準、外部檢查與承擔判斷的人</text>
</svg>
