<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" font-family="PingFang TC, Hiragino Sans GB, sans-serif">
<rect width="1000" height="1000" fill="#FFFFFF"/>
<g transform="translate(0,-90)">
<rect x="40" y="740" width="430" height="120" rx="18" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="3"/>
<text x="255" y="800" font-size="34" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">一問一答</text>
<rect x="170" y="560" width="430" height="120" rx="18" fill="#F5F2EC" stroke="#A6B7BA" stroke-width="4"/>
<text x="385" y="620" font-size="32" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">交辦整件工作</text>
<rect x="300" y="380" width="430" height="120" rx="18" fill="#F5F2EC" stroke="#A6B7BA" stroke-width="4"/>
<text x="515" y="440" font-size="32" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">放進固定流程</text>

<rect x="520" y="300" width="160" height="54" rx="27" fill="#F5F2EC" stroke="#A6B7BA" stroke-width="3"/>
<text x="600" y="327" font-size="24" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">推廣者</text>

<rect x="350" y="503" width="190" height="54" rx="27" fill="#F5F2EC" stroke="#A6B7BA" stroke-width="3"/>
<text x="445" y="530" font-size="24" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">深度使用者</text>

<rect x="60" y="880" width="140" height="54" rx="27" fill="#F5F2EC" stroke="#A6B7BA" stroke-width="3"/>
<text x="130" y="907" font-size="24" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">探索者</text>

<rect x="230" y="880" width="140" height="54" rx="27" fill="#F5F2EC" stroke="#A6B7BA" stroke-width="3"/>
<text x="300" y="907" font-size="24" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">跟隨者</text>

<rect x="400" y="880" width="180" height="54" rx="27" fill="#F5F2EC" stroke="#BE8979" stroke-width="4"/>
<text x="490" y="907" font-size="24" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">被迫使用者</text>

<rect x="760" y="350" width="200" height="560" rx="24" fill="none" stroke="#D8D2C9" stroke-width="3" stroke-dasharray="10 9"/>
<text x="860" y="430" font-size="24" fill="#6B6560" font-weight="600" text-anchor="middle" dominant-baseline="central">私下使用者</text>
<text x="860" y="470" font-size="19" fill="#6B6560" font-weight="500" text-anchor="middle" dominant-baseline="central">深度不一定低，</text>
<text x="860" y="498" font-size="19" fill="#6B6560" font-weight="500" text-anchor="middle" dominant-baseline="central">只是不公開</text>
</g>
</svg>
