<text x="160" y="640" font-size="26" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">承擔判斷</text>
<text x="430" y="280" font-size="24" fill="#2A2623" font-weight="500" text-anchor="middle" dominant-baseline="central">知道好的結果長什麼樣子</text>
