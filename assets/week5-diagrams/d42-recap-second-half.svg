<text x="765" y="265" font-size="24" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">提供帳號與環境</text>

<rect x="60" y="320" width="350" height="80" rx="18" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="3"/>
<text x="235" y="360" font-size="24" fill="#BE8979" font-weight="600" text-anchor="middle" dominant-baseline="central">不敢用</text>
