<rect x="590" y="130" width="350" height="80" rx="18" fill="#F5F2EC" stroke="#A6B7BA" stroke-width="4"/>
<text x="765" y="170" font-size="24" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">教會挑任務與判斷</text>

<rect x="60" y="225" width="350" height="80" rx="18" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="3"/>
