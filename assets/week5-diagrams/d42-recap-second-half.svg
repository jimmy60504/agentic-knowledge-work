<rect x="590" y="510" width="350" height="80" rx="18" fill="#F5F2EC" stroke="#A6B7BA" stroke-width="4"/>
<text x="765" y="550" font-size="24" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">不以使用率考核</text>

<rect x="60" y="605" width="350" height="80" rx="18" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="3"/>
