<rect x="540" y="780" width="300" height="90" rx="18" fill="#F5F2EC" stroke="#A6B7BA" stroke-width="4"/>
<text x="690" y="825" font-size="26" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">以返工評估成效</text>
