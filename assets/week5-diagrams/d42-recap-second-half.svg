<rect x="590" y="415" width="350" height="80" rx="18" fill="#F5F2EC" stroke="#A6B7BA" stroke-width="4"/>
<text x="765" y="455" font-size="24" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">說定利益與保障</text>

