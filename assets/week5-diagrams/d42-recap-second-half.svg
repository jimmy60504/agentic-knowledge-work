<text x="765" y="645" font-size="24" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">借重懷疑者的判斷</text>

<line x1="60" y1="730" x2="940" y2="730" stroke="#D8D2C9" stroke-width="2" stroke-dasharray="8 8"/>

<rect x="300" y="780" width="160" height="90" rx="18" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="3"/>
<text x="380" y="825" font-size="26" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">全體</text>
