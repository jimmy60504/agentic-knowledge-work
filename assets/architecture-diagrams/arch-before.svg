<rect x="80" y="748" width="24" height="24" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/><text x="114" y="760" font-size="20" fill="#5F5E5A" dominant-baseline="central">檔案</text>
<rect x="196" y="748" width="24" height="24" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="230" y="760" font-size="20" fill="#5F5E5A" dominant-baseline="central">程式</text>
<line x1="1130" y1="210" x2="1130" y2="700" stroke="#D3D1C7" stroke-width="1.5"/>
<circle cx="1177" cy="234" r="17" fill="#EF9F27"/><text x="1177" y="235" font-size="20" font-weight="600" fill="#412402" text-anchor="middle" dominant-baseline="central">1</text>
<text x="1208" y="234" font-size="23" fill="#2C2C2A" dominant-baseline="central">每個程式只讀寫自己的檔案格式，</text>
<text x="1208" y="268" font-size="23" fill="#2C2C2A" dominant-baseline="central">上一步的輸出即是下一步的輸入。</text>
<circle cx="1177" cy="332" r="17" fill="#EF9F27"/><text x="1177" y="333" font-size="20" font-weight="600" fill="#412402" text-anchor="middle" dominant-baseline="central">2</text>
<text x="1208" y="332" font-size="23" fill="#2C2C2A" dominant-baseline="central">定位程式直接改寫相位檔，</text>
<text x="1208" y="366" font-size="23" fill="#2C2C2A" dominant-baseline="central">定位前後的內容存在同一個檔案。</text>
<circle cx="1177" cy="430" r="17" fill="#EF9F27"/><text x="1177" y="431" font-size="20" font-weight="600" fill="#412402" text-anchor="middle" dominant-baseline="central">3</text>
<text x="1208" y="430" font-size="23" fill="#2C2C2A" dominant-baseline="central">QC 與入庫逐檔讀相位檔；</text>
<text x="1208" y="464" font-size="23" fill="#2C2C2A" dominant-baseline="central">退件時回到挑波程式修改，</text>
<text x="1208" y="498" font-size="23" fill="#2C2C2A" dominant-baseline="central">再重新定位。</text>
<circle cx="1177" cy="562" r="17" fill="#EF9F27"/><text x="1177" y="563" font-size="20" font-weight="600" fill="#412402" text-anchor="middle" dominant-baseline="central">4</text>
<text x="1208" y="562" font-size="23" fill="#2C2C2A" dominant-baseline="central">追查一個事件改過什麼，</text>
<text x="1208" y="596" font-size="23" fill="#2C2C2A" dominant-baseline="central">只能比對各階段留下的檔案；</text>
<text x="1208" y="630" font-size="23" fill="#2C2C2A" dominant-baseline="central">格式一有變動，</text>
<text x="1208" y="664" font-size="23" fill="#2C2C2A" dominant-baseline="central">前後的程式都要跟著修改。</text>
