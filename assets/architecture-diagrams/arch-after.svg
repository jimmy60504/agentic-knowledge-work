<circle cx="110" cy="268" r="17" fill="#EF9F27"/><text x="110" y="269" font-size="20" font-weight="600" fill="#412402" text-anchor="middle" dominant-baseline="central">1</text>
<circle cx="110" cy="410" r="17" fill="#EF9F27"/><text x="110" y="411" font-size="20" font-weight="600" fill="#412402" text-anchor="middle" dominant-baseline="central">2</text>
<circle cx="110" cy="670" r="17" fill="#EF9F27"/><text x="110" y="671" font-size="20" font-weight="600" fill="#412402" text-anchor="middle" dominant-baseline="central">3</text>
<rect x="80" y="818" width="24" height="24" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="114" y="830" font-size="20" fill="#5F5E5A" dominant-baseline="central">模組</text>
<rect x="196" y="818" width="24" height="24" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="230" y="830" font-size="20" fill="#5F5E5A" dominant-baseline="central">內部的資料</text>
<rect x="375" y="818" width="24" height="24" rx="5" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="409" y="830" font-size="20" fill="#5F5E5A" dominant-baseline="central">轉接層</text>
<rect x="500" y="818" width="24" height="24" rx="5" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="5 4"/><text x="534" y="830" font-size="20" fill="#5F5E5A" dominant-baseline="central">規劃中</text>
<line x1="1110" y1="196" x2="1110" y2="764" stroke="#D3D1C7" stroke-width="1.5"/>
<circle cx="1157" cy="220" r="17" fill="#EF9F27"/><text x="1157" y="221" font-size="20" font-weight="600" fill="#412402" text-anchor="middle" dominant-baseline="central">1</text>
<text x="1188" y="220" font-size="23" fill="#2C2C2A" dominant-baseline="central">切地震、定地震、QC 與資料管理</text>
<text x="1188" y="254" font-size="23" fill="#2C2C2A" dominant-baseline="central">是同一個系統的模組，</text>
<text x="1188" y="288" font-size="23" fill="#2C2C2A" dominant-baseline="central">不再以檔案交接。</text>
<circle cx="1157" cy="340" r="17" fill="#EF9F27"/><text x="1157" y="341" font-size="20" font-weight="600" fill="#412402" text-anchor="middle" dominant-baseline="central">2</text>
<text x="1188" y="340" font-size="23" fill="#2C2C2A" dominant-baseline="central">挑選、定位解、殘差與修改紀錄</text>
<text x="1188" y="374" font-size="23" fill="#2C2C2A" dominant-baseline="central">存在資料庫，每個事件的經過</text>
<text x="1188" y="408" font-size="23" fill="#2C2C2A" dominant-baseline="central">可以直接查詢。</text>
<circle cx="1157" cy="460" r="17" fill="#EF9F27"/><text x="1157" y="461" font-size="20" font-weight="600" fill="#412402" text-anchor="middle" dominant-baseline="central">3</text>
<text x="1188" y="460" font-size="23" fill="#2C2C2A" dominant-baseline="central">讀入、定位與匯出時才轉換格式；</text>
<text x="1188" y="494" font-size="23" fill="#2C2C2A" dominant-baseline="central">接上新的波形格式或定位程式，</text>
<text x="1188" y="528" font-size="23" fill="#2C2C2A" dominant-baseline="central">只要多寫一個轉接。</text>
<rect x="1140" y="572" width="420" height="280" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
<text x="1162" y="606" font-size="22" font-weight="600" fill="#633806" dominant-baseline="central">目前的進度</text>
<circle cx="1170" cy="642" r="4" fill="#854F0B"/>
<text x="1184" y="642" font-size="20" fill="#633806" dominant-baseline="central">資料庫依 QuakeML 的概念設計，</text>
<text x="1184" y="672" font-size="20" fill="#633806" dominant-baseline="central">尚未讀寫 QuakeML 的 XML。</text>
<circle cx="1170" cy="714" r="4" fill="#854F0B"/>
<text x="1184" y="714" font-size="20" fill="#633806" dominant-baseline="central">QC 仍經由相位檔轉接，</text>
<text x="1184" y="744" font-size="20" fill="#633806" dominant-baseline="central">交給規則庫檢查。</text>
<circle cx="1170" cy="786" r="4" fill="#854F0B"/>
<text x="1184" y="786" font-size="20" fill="#633806" dominant-baseline="central">虛線的轉接（其他波形格式、</text>
<text x="1184" y="816" font-size="20" fill="#633806" dominant-baseline="central">其他定位程式）為規劃，尚未實作。</text>
