<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" font-family="PingFang TC, Hiragino Sans GB, sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BE8979"/></marker>
</defs>
<rect width="1600" height="600" fill="#FFFFFF"/>
<rect x="40" y="220" width="260" height="130" rx="16" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="3"/>
<text x="170.0" y="285.0" font-size="30" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">主管派發</text>
<rect x="340" y="220" width="260" height="130" rx="16" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="3"/>
<text x="470.0" y="285.0" font-size="30" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">承辦定位</text>
<rect x="640" y="220" width="260" height="130" rx="16" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="3"/>
<text x="770.0" y="265.5" font-size="30" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">產出</text>
<text x="770.0" y="304.5" font-size="30" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">定位結果檔</text>
<rect x="940" y="220" width="260" height="130" rx="16" fill="#F6EAE5" stroke="#BE8979" stroke-width="3" stroke-dasharray="12 8"/>
<text x="1070.0" y="285.0" font-size="30" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">承辦自行檢查</text>
<rect x="1260" y="220" width="300" height="130" rx="16" fill="#F6EAE5" stroke="#BE8979" stroke-width="3"/>
<text x="1410.0" y="285.0" font-size="30" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">主管檢視</text>
<polyline points="300,285.0 340,285.0" fill="none" stroke="#6B6560" stroke-width="3" marker-end="url(#ah)"/>
<polyline points="600,285.0 640,285.0" fill="none" stroke="#6B6560" stroke-width="3" marker-end="url(#ah)"/>
<polyline points="900,285.0 940,285.0" fill="none" stroke="#6B6560" stroke-width="3" marker-end="url(#ah)"/>
<polyline points="1200,285.0 1260,285.0" fill="none" stroke="#6B6560" stroke-width="3" marker-end="url(#ah)"/>
<text x="170" y="390.0" font-size="22" fill="#6B6560" text-anchor="middle" dominant-baseline="central">派工網頁</text>
<text x="470" y="390.0" font-size="22" fill="#6B6560" text-anchor="middle" dominant-baseline="central">定位軟體</text>
<text x="1070" y="380.7" font-size="22" fill="#BE8979" text-anchor="middle" dominant-baseline="central">依訓練投影片與紙本清單</text>
<text x="1070" y="409.3" font-size="22" fill="#BE8979" text-anchor="middle" dominant-baseline="central">做不做、做到哪裡都靠自己</text>
<text x="1340" y="395.0" font-size="22" fill="#BE8979" text-anchor="middle" dominant-baseline="central">人工檢視</text>
<polyline points="1410,220 1410,110 470,110 470,220" fill="none" stroke="#BE8979" stroke-width="4" marker-end="url(#ahr)"/>
<text x="940" y="80.0" font-size="26" fill="#BE8979" text-anchor="middle" dominant-baseline="central">發現問題就退回，修正後再交</text>
<polyline points="1410,350 1410,520" fill="none" stroke="#6B6560" stroke-width="3" marker-end="url(#ah)"/>
<text x="1490" y="540.0" font-size="24" fill="#6B6560" text-anchor="middle" dominant-baseline="central">通過</text>
