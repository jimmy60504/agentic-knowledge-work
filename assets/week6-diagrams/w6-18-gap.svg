<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" font-family="PingFang TC, Hiragino Sans GB, sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BE8979"/></marker>
</defs>
<rect width="1600" height="600" fill="#FFFFFF"/>
<rect x="60" y="220" width="280" height="130" rx="16" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="3"/>
<text x="200.0" y="285.0" font-size="30" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">定位軟體</text>
<rect x="500" y="220" width="280" height="130" rx="16" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="3"/>
<text x="640.0" y="285.0" font-size="30" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">定位結果檔</text>
<rect x="1220" y="220" width="300" height="130" rx="16" fill="#EAF0F1" stroke="#A6B7BA" stroke-width="3"/>
<text x="1370.0" y="285.0" font-size="30" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">主管檢視</text>
<polyline points="340,285 500,285" fill="none" stroke="#6B6560" stroke-width="3" marker-end="url(#ah)"/>
<text x="420" y="365.7" font-size="22" fill="#BE8979" text-anchor="middle" dominant-baseline="central">缺少防呆</text>
<text x="420" y="394.3" font-size="22" fill="#BE8979" text-anchor="middle" dominant-baseline="central">能產出簡單錯誤</text>
