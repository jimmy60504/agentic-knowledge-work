<text x="1000" y="250.0" font-size="26" fill="#BE8979" font-weight="600" text-anchor="middle" dominant-baseline="central">直接上交</text>
<rect x="860" y="400" width="280" height="110" rx="16" fill="#FFFFFF" stroke="#D8D2C9" stroke-width="3" stroke-dasharray="12 8"/>
<text x="1000.0" y="455.0" font-size="26" fill="#6B6560" text-anchor="middle" dominant-baseline="central">兩支檢查程式</text>
<polyline points="1000,400 1000,310" fill="none" stroke="#6B6560" stroke-width="3" stroke-dasharray="12 8" marker-end="url(#ah)"/>
<text x="1000" y="545.0" font-size="24" fill="#6B6560" text-anchor="middle" dominant-baseline="central">不是必經的節點，執行與否靠承辦自己想到</text>
<rect x="820" y="70" width="360" height="100" rx="16" fill="#F6EAE5" stroke="#BE8979" stroke-width="3"/>
<text x="1000.0" y="120.0" font-size="26" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">缺口：沒有攔截的位置</text>
