<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="PingFang TC, Hiragino Sans GB, sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BE8979"/></marker>
</defs>
<rect width="1200" height="900" fill="#FFFFFF"/>
<rect x="40" y="60" width="300" height="140" rx="16" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="3"/>
<text x="190.0" y="113.8" font-size="30" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">執行檔</text>
<text x="190.0" y="150.2" font-size="24" fill="#6B6560" text-anchor="middle" dominant-baseline="central">只有執行檔，沒有原始碼</text>
<rect x="450" y="60" width="300" height="140" rx="16" fill="#EAF0F1" stroke="#A6B7BA" stroke-width="3"/>
<text x="600.0" y="113.8" font-size="30" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">反組譯工具</text>
<text x="600.0" y="150.2" font-size="24" fill="#6B6560" text-anchor="middle" dominant-baseline="central">Ghidra、IDA 等</text>
<rect x="860" y="60" width="300" height="140" rx="16" fill="#F6EAE5" stroke="#BE8979" stroke-width="3"/>
<text x="1010.0" y="113.8" font-size="30" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">Agent</text>
<text x="1010.0" y="150.2" font-size="24" fill="#6B6560" text-anchor="middle" dominant-baseline="central">Claude Code、Codex 等</text>
<polyline points="346,130 444,130" fill="none" stroke="#6B6560" stroke-width="3" marker-end="url(#ah)"/>
<text x="395" y="108.0" font-size="22" fill="#6B6560" text-anchor="middle" dominant-baseline="central">分析</text>
<polyline points="756,115 854,115" fill="none" stroke="#BE8979" stroke-width="3" marker-end="url(#ahr)"/>
<polyline points="854,150 756,150" fill="none" stroke="#BE8979" stroke-width="3" marker-end="url(#ahr)"/>
<text x="805" y="95.0" font-size="22" fill="#BE8979" font-weight="600" text-anchor="middle" dominant-baseline="central">MCP</text>
<rect x="560" y="260" width="600" height="96" rx="16" fill="#FFFFFF" stroke="#D8D2C9" stroke-width="3"/>
<circle cx="610" cy="308" r="24" fill="#BE8979"/>
<text x="610" y="308.0" font-size="24" fill="#FFFFFF" font-weight="600" text-anchor="middle" dominant-baseline="central">1</text>
<text x="660" y="293.0" font-size="26" fill="#2A2623" font-weight="600" text-anchor="start" dominant-baseline="central">檢視程式</text>
<text x="660" y="328.0" font-size="21" fill="#6B6560" text-anchor="start" dominant-baseline="central">查詢函式與呼叫關係</text>
<polyline points="860,358 860,378" fill="none" stroke="#6B6560" stroke-width="3" marker-end="url(#ah)"/>
<rect x="560" y="380" width="600" height="96" rx="16" fill="#FFFFFF" stroke="#D8D2C9" stroke-width="3"/>
<circle cx="610" cy="428" r="24" fill="#BE8979"/>
<text x="610" y="428.0" font-size="24" fill="#FFFFFF" font-weight="600" text-anchor="middle" dominant-baseline="central">2</text>
<text x="660" y="413.0" font-size="26" fill="#2A2623" font-weight="600" text-anchor="start" dominant-baseline="central">追蹤行為</text>
<text x="660" y="448.0" font-size="21" fill="#6B6560" text-anchor="start" dominant-baseline="central">從想了解的功能往下追</text>
<polyline points="860,478 860,498" fill="none" stroke="#6B6560" stroke-width="3" marker-end="url(#ah)"/>
<rect x="560" y="500" width="600" height="96" rx="16" fill="#FFFFFF" stroke="#BE8979" stroke-width="3"/>
<circle cx="610" cy="548" r="24" fill="#BE8979"/>
<text x="610" y="548.0" font-size="24" fill="#FFFFFF" font-weight="600" text-anchor="middle" dominant-baseline="central">3</text>
<text x="660" y="533.0" font-size="26" fill="#2A2623" font-weight="600" text-anchor="start" dominant-baseline="central">驗證假設</text>
<text x="660" y="568.0" font-size="21" fill="#6B6560" text-anchor="start" dominant-baseline="central">提出假設，回到執行檔確認</text>
<polyline points="860,598 860,618" fill="none" stroke="#6B6560" stroke-width="3" marker-end="url(#ah)"/>
<rect x="560" y="620" width="600" height="96" rx="16" fill="#FFFFFF" stroke="#BE8979" stroke-width="3"/>
<circle cx="610" cy="668" r="24" fill="#BE8979"/>
<text x="610" y="668.0" font-size="24" fill="#FFFFFF" font-weight="600" text-anchor="middle" dominant-baseline="central">4</text>
<text x="660" y="653.0" font-size="26" fill="#2A2623" font-weight="600" text-anchor="start" dominant-baseline="central">重建行為</text>
<text x="660" y="688.0" font-size="21" fill="#6B6560" text-anchor="start" dominant-baseline="central">寫出行為相同的程式</text>
<polyline points="1010,214 1010,254" fill="none" stroke="#BE8979" stroke-width="3" marker-end="url(#ahr)"/>
<polyline points="1166,548 1185,548 1185,428 1166,428" fill="none" stroke="#BE8979" stroke-width="3" stroke-dasharray="12 8" marker-end="url(#ahr)"/>
<text x="1150" y="488.0" font-size="20" fill="#BE8979" text-anchor="end" dominant-baseline="central">反覆</text>
<rect x="40" y="720" width="500" height="130" rx="16" fill="#F5F2EC" stroke="#BE8979" stroke-width="3"/>
<text x="290.0" y="768.8" font-size="30" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">以測試與原程式比對</text>
<text x="290.0" y="805.2" font-size="24" fill="#6B6560" text-anchor="middle" dominant-baseline="central">重建的程式與執行檔，結果逐一相同</text>
<polyline points="556,680 290,680 290,714" fill="none" stroke="#BE8979" stroke-width="3" marker-end="url(#ahr)"/>
<polyline points="190,714 190,206" fill="none" stroke="#6B6560" stroke-width="3" stroke-dasharray="12 8" marker-end="url(#ah)"/>
<text x="205" y="460.0" font-size="22" fill="#6B6560" text-anchor="start" dominant-baseline="central">對照</text>
<text x="850" y="800.0" font-size="24" fill="#BE8979" font-weight="600" text-anchor="middle" dominant-baseline="central">重建的是行為，不是原始碼</text>
<text x="850" y="840.0" font-size="20" fill="#6B6560" text-anchor="middle" dominant-baseline="central">依專案說明整理，開發者尚未實際試用</text>
</svg>
