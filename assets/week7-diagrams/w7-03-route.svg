<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 300" width="1600" height="300" font-family="PingFang TC, Hiragino Sans GB, sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BE8979"/></marker>
</defs>
<rect width="1600" height="300" fill="#FFFFFF"/>
<rect x="30" y="60" width="260" height="180" rx="16" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="3"/>
<text x="160.0" y="100.0" font-size="30" fill="#6B6560" font-weight="600" text-anchor="middle" dominant-baseline="central">一</text>
<text x="160.0" y="155.0" font-size="28" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">兩個題目與</text>
<text x="160.0" y="195.0" font-size="28" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">整體架構</text>
<polyline points="296,150 344,150" fill="none" stroke="#6B6560" stroke-width="3" marker-end="url(#ah)"/>
<rect x="350" y="60" width="260" height="180" rx="16" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="3"/>
<text x="480.0" y="100.0" font-size="30" fill="#6B6560" font-weight="600" text-anchor="middle" dominant-baseline="central">二</text>
<text x="480.0" y="155.0" font-size="28" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">從投影片到</text>
<text x="480.0" y="195.0" font-size="28" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">每個步驟</text>
<polyline points="616,150 664,150" fill="none" stroke="#6B6560" stroke-width="3" marker-end="url(#ah)"/>
<rect x="670" y="60" width="260" height="180" rx="16" fill="#F6EAE5" stroke="#BE8979" stroke-width="3"/>
<text x="800.0" y="100.0" font-size="30" fill="#BE8979" font-weight="600" text-anchor="middle" dominant-baseline="central">三</text>
<text x="800.0" y="155.0" font-size="28" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">規則與來源</text>
<text x="800.0" y="195.0" font-size="28" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">的大表</text>
<polyline points="936,150 984,150" fill="none" stroke="#6B6560" stroke-width="3" marker-end="url(#ah)"/>
<rect x="990" y="60" width="260" height="180" rx="16" fill="#F6EAE5" stroke="#BE8979" stroke-width="3"/>
<text x="1120.0" y="100.0" font-size="30" fill="#BE8979" font-weight="600" text-anchor="middle" dominant-baseline="central">四</text>
<text x="1120.0" y="155.0" font-size="28" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">證據鏈</text>
<text x="1120.0" y="195.0" font-size="28" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">與測試</text>
<polyline points="1256,150 1304,150" fill="none" stroke="#6B6560" stroke-width="3" marker-end="url(#ah)"/>
<rect x="1310" y="60" width="260" height="180" rx="16" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="3"/>
<text x="1440.0" y="100.0" font-size="30" fill="#6B6560" font-weight="600" text-anchor="middle" dominant-baseline="central">五</text>
<text x="1440.0" y="155.0" font-size="28" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">從原型到</text>
<text x="1440.0" y="195.0" font-size="28" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">正式工具</text>
<text x="800" y="275.0" font-size="22" fill="#BE8979" text-anchor="middle" dominant-baseline="central">第三、四段是本週的重點</text>
</svg>
