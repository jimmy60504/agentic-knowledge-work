<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 730" width="1600" height="730" font-family="PingFang TC, Hiragino Sans GB, sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BE8979"/></marker>
</defs>
<rect width="1600" height="730" fill="#FFFFFF"/>
<rect x="30" y="30" width="1540" height="270" rx="16" fill="none" stroke="#D8D2C9" stroke-width="3" stroke-dasharray="12 8"/>
<text x="56" y="64.0" font-size="26" fill="#6B6560" font-weight="600" text-anchor="start" dominant-baseline="central">挑波端</text>
<rect x="30" y="320" width="1540" height="260" rx="16" fill="none" stroke="#A6B7BA" stroke-width="3" stroke-dasharray="12 8"/>
<text x="56" y="354.0" font-size="26" fill="#6B6560" font-weight="600" text-anchor="start" dominant-baseline="central">檢查端</text>
<rect x="90" y="110" width="260" height="130" rx="16" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="3"/>
<text x="220.0" y="158.8" font-size="30" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">預檢標出問題</text>
<text x="220.0" y="195.2" font-size="24" fill="#6B6560" text-anchor="middle" dominant-baseline="central">送出前執行</text>
<rect x="460" y="70" width="420" height="105" rx="16" fill="#F6EAE5" stroke="#BE8979" stroke-width="3"/>
<text x="670.0" y="107.7" font-size="30" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">修正</text>
<text x="670.0" y="142.8" font-size="22" fill="#6B6560" text-anchor="middle" dominant-baseline="central">程式提出，承辦預覽後套用</text>
<g transform="translate(842,80) scale(1.0833333333333333)" fill="none" stroke="#BE8979" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" /><path d="M9 5a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2" /><path d="M9 12l.01 0" /><path d="M13 12l2 0" /><path d="M9 16l.01 0" /><path d="M13 16l2 0" /></g>
<rect x="460" y="190" width="420" height="105" rx="16" fill="#F6EAE5" stroke="#BE8979" stroke-width="3"/>
<text x="670.0" y="227.7" font-size="30" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">提示</text>
<text x="670.0" y="262.8" font-size="22" fill="#6B6560" text-anchor="middle" dominant-baseline="central">確認無誤，或問題回報（說明必填）</text>
<g transform="translate(842,200) scale(1.0833333333333333)" fill="none" stroke="#BE8979" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" /><path d="M9 5a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2" /><path d="M9 12l.01 0" /><path d="M13 12l2 0" /><path d="M9 16l.01 0" /><path d="M13 16l2 0" /></g>
<rect x="990" y="110" width="240" height="130" rx="16" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="3"/>
<text x="1110.0" y="158.8" font-size="30" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">送出</text>
<text x="1110.0" y="195.2" font-size="24" fill="#6B6560" text-anchor="middle" dominant-baseline="central">交給檢查端</text>
<polyline points="350,160 454,124" fill="none" stroke="#6B6560" stroke-width="3" marker-end="url(#ah)"/>
<polyline points="350,190 454,240" fill="none" stroke="#6B6560" stroke-width="3" marker-end="url(#ah)"/>
<polyline points="880,124 984,160" fill="none" stroke="#6B6560" stroke-width="3" marker-end="url(#ah)"/>
<polyline points="880,240 984,190" fill="none" stroke="#6B6560" stroke-width="3" marker-end="url(#ah)"/>
<text x="1260" y="110.0" font-size="22" fill="#6B6560" text-anchor="start" dominant-baseline="central">自動修正改為由人按下：</text>
<text x="1260" y="145.0" font-size="22" fill="#6B6560" text-anchor="start" dominant-baseline="central">程式不自行修改，</text>
<text x="1260" y="180.0" font-size="22" fill="#6B6560" text-anchor="start" dominant-baseline="central">避免誤以為已經處理</text>
<rect x="990" y="400" width="240" height="130" rx="16" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="3"/>
<text x="1110.0" y="448.8" font-size="30" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">檢查端檢查</text>
<text x="1110.0" y="485.2" font-size="24" fill="#6B6560" text-anchor="middle" dominant-baseline="central">逐筆檢視</text>
<polyline points="1110,240 1110,394" fill="none" stroke="#6B6560" stroke-width="3" marker-end="url(#ah)"/>
<rect x="460" y="410" width="420" height="110" rx="16" fill="#F6EAE5" stroke="#BE8979" stroke-width="3"/>
<text x="670.0" y="450.1" font-size="30" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">退回</text>
<text x="670.0" y="485.2" font-size="22" fill="#6B6560" text-anchor="middle" dominant-baseline="central">寫明理由，回到挑波端重新處理</text>
<g transform="translate(842,420) scale(1.0833333333333333)" fill="none" stroke="#BE8979" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" /><path d="M9 5a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2" /><path d="M9 12l.01 0" /><path d="M13 12l2 0" /><path d="M9 16l.01 0" /><path d="M13 16l2 0" /></g>
<polyline points="990,465 886,465" fill="none" stroke="#6B6560" stroke-width="3" marker-end="url(#ah)"/>
<polyline points="460,465 220,465 220,246" fill="none" stroke="#BE8979" stroke-width="3" stroke-dasharray="12 8" marker-end="url(#ahr)"/>
<text x="240" y="420.0" font-size="22" fill="#BE8979" text-anchor="start" dominant-baseline="central">重新處理</text>
<rect x="1285" y="345" width="265" height="100" rx="16" fill="#F6EAE5" stroke="#BE8979" stroke-width="3"/>
<text x="1417.5" y="380.1" font-size="30" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">確認</text>
<text x="1417.5" y="415.2" font-size="22" fill="#6B6560" text-anchor="middle" dominant-baseline="central">進入入庫整理</text>
<g transform="translate(1512,355) scale(1.0833333333333333)" fill="none" stroke="#BE8979" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" /><path d="M9 5a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2" /><path d="M9 12l.01 0" /><path d="M13 12l2 0" /><path d="M9 16l.01 0" /><path d="M13 16l2 0" /></g>
<rect x="1285" y="460" width="265" height="100" rx="16" fill="#F6EAE5" stroke="#BE8979" stroke-width="3"/>
<text x="1417.5" y="495.2" font-size="26" fill="#2A2623" font-weight="600" text-anchor="middle" dominant-baseline="central">標記異常事件</text>
<text x="1417.5" y="527.6" font-size="22" fill="#6B6560" text-anchor="middle" dominant-baseline="central">收到回報後標記</text>
<g transform="translate(1512,470) scale(1.0833333333333333)" fill="none" stroke="#BE8979" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" /><path d="M9 5a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2" /><path d="M9 12l.01 0" /><path d="M13 12l2 0" /><path d="M9 16l.01 0" /><path d="M13 16l2 0" /></g>
<polyline points="1230,440 1279,395" fill="none" stroke="#6B6560" stroke-width="3" marker-end="url(#ah)"/>
<polyline points="1230,490 1279,510" fill="none" stroke="#6B6560" stroke-width="3" marker-end="url(#ah)"/>
<rect x="30" y="610" width="1540" height="95" rx="14" fill="#F5F2EC" stroke="#D8D2C9" stroke-width="3"/>
<g transform="translate(70,638) scale(1.6666666666666667)" fill="none" stroke="#BE8979" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" /><path d="M9 5a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2" /><path d="M9 12l.01 0" /><path d="M13 12l2 0" /><path d="M9 16l.01 0" /><path d="M13 16l2 0" /></g>
<text x="130" y="645.0" font-size="26" fill="#2A2623" font-weight="600" text-anchor="start" dominant-baseline="central">每一個由人按下的動作都記下：誰、何時、做了什麼、為什麼</text>
<text x="130" y="682.0" font-size="22" fill="#6B6560" text-anchor="start" dominant-baseline="central">從送出到檢查，每一筆資料都有人負責、有紀錄可查（粉色框右上角的圖示代表留下紀錄）</text>
</svg>
